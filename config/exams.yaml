# 보류 능력단위의 「지식」 항목을 온라인 시험으로 확인할 때 쓸 시험 목록.  2026-09-24
#
# 키 = NCS 세분류 코드(능력단위 코드 앞 8자리). 계획 페이지(services/review/plan.py)가 단위 코드로 찾는다.
# 규칙: **링크는 브라우저로 열어 확인한 것만 적는다.** 확인 못 했으면 url: null 로 두고 note 에 「링크 미확인」.
#       시험 이름·주관기관도 확인한 것만. 없는 시험을 지어 넣지 않는다.
#
# 2026-09-24 큐넷(q-net.or.kr)에서 확인한 사실:
#   · 큐넷 자료실은 「출제기준」「기출문제(기술사)」「공개문제(실기)」만 둔다. **기능사·산업기사·기사 필기 기출문제는 공개하지 않는다**(CBT 전환 후).
#   · 따라서 「온라인 시험은행」에 해당하는 공공 자원은 없다. 아래 항목은 **범위 확인용 출제기준**이며, 문항은 위원이 마련하거나
#     외부 문제은행(미확인)을 써야 한다. 이 한계는 계획 페이지 파라미터 표에 「TF 결정 필요」로 적혀 있다.
#   · 확인한 페이지: 출제기준 자료실, 공개문제 자료실, 국가자격 종목별 상세정보, CBT 체험하기 (아래 url).
# 지금은 C2(건축설계·실내건축설계)·A3(철근콘크리트시공·가설시공) 분야만 있다. 다른 분야는 「등록된 온라인 시험 없음 → 면접」으로 나간다.

_common: &qnet
  provider: 한국산업인력공단 큐넷(Q-Net)
  url: https://www.q-net.or.kr/cst006.do?id=cst00601&code=1202&gSite=Q&gId=     # 자료실 › 출제기준 (종목명으로 검색)
  note: 필기 기출문제는 큐넷 미공개(기술사만) — 출제기준으로 범위만 확인, 문항은 별도 마련 필요

"14030101":
  name: 건축설계
  exams:
    - {<<: *qnet, name: 건축기사 필기 출제기준, scope: 출제기준 PDF 에서 확인 (과목 미기재)}
    - {<<: *qnet, name: 전산응용건축제도기능사 필기 출제기준, scope: 출제기준 PDF 에서 확인 (과목 미기재)}

"14030104":
  name: 실내건축설계
  exams:
    - {<<: *qnet, name: 실내건축기사 필기 출제기준, scope: 출제기준 PDF 에서 확인 (과목 미기재)}
    - {<<: *qnet, name: 실내건축산업기사 필기 출제기준, scope: 출제기준 PDF 에서 확인 (과목 미기재)}

"14030206":
  name: 철근콘크리트시공
  exams:
    - {<<: *qnet, name: 철근기능사 필기 출제기준, scope: 출제기준 PDF 에서 확인 (과목 미기재)}
    - {<<: *qnet, name: 콘크리트기능사 필기 출제기준, scope: 출제기준 PDF 에서 확인 (과목 미기재)}

"14030208":
  name: 가설시공
  exams: []        # 가설시공 단독 필기 시험은 확인된 것이 없다 → 면접

