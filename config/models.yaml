# LLM 호출 파라미터. 코드가 아니라 여기서 관리합니다.
default: trackb_assess

profiles:
  trackb_assess:
    provider: anthropic
    # 2026-09-23 Haiku 4.5 로 교체 (4·5차 집담회 시연·비용 절감). 정확한 ID: claude-haiku-4-5
    #   (= 스냅샷 claude-haiku-4-5-20251001). 출력 상한 64,000 · 컨텍스트 200K.
    #   Haiku 4.5 는 output_config.effort 를 받지 않는다(400) → effort: null 로 둔다.
    #   thinking 은 adaptive 가 아니라 {type: enabled, budget_tokens: N} 방식. N < max_tokens, 최소 1024.
    # Opus 로 되돌리려면 --profile trackb_assess_opus.
    model: claude-haiku-4-5
    max_tokens: 64000
    streaming: true                  # 출력 100KB 이상 — 타임아웃 방지
    thinking: {type: enabled, budget_tokens: 16000}
    effort: null                     # Haiku 4.5 는 effort 미지원. Opus/Sonnet 프로파일에서만 low|medium|high|xhigh|max
    structured_output: null
    cache:
      enabled: true
      # 앞에서부터 이 개수만큼의 system 블록에 캐시를 건다.
      #   1 분석지침 · 2 기준요약 · 3 지원자 자료(문서·조각·기이수)
      # 셋 다 한 건 안에서는 고정이고, 청크마다 그대로 반복되므로 캐시가 먹는다.
      # 청크 방식 도입 전에는 재시도 간격이 5분 TTL 을 넘겨 캐시가 무용이었다.
      blocks: [prompt, rubric, applicant]
    timeout_sec: 900
    max_retries: 2

  # 비교·조정용 프로파일. `--profile` 로 그때그때 바꿔 쓴다.
  trackb_assess_opus:                # 2026-09-23 이전 기본값. 실측(4건×2방식, 2026-08-22):
    provider: anthropic              #   high 사고 50,570 토큰·$3.571·9분01초 / medium 20,311·$3.033·7분22초, 품질 차이 없음
    model: claude-opus-5             # (상속은 한 단계 + 깊은 병합이라 thinking 이 섞이지 않도록 독립 정의)
    max_tokens: 120000               # 모델 한도 128,000. 상한이지 예약이 아니라 올려도 비용은 안 는다
    streaming: true
    thinking: {type: adaptive}
    effort: medium
    structured_output: null
    cache: {enabled: true, blocks: [prompt, rubric, applicant]}
    timeout_sec: 900
    max_retries: 2

  trackb_assess_high:
    inherits: trackb_assess_opus
    effort: high

  trackb_assess_low:
    inherits: trackb_assess_opus
    effort: low

  trackb_plan:                       # 위원 제출 뒤 확인 계획 문안(면접 질문·시연 과제·시험 범위). 2026-09-24
    inherits: trackb_assess
    max_tokens: 16000
    thinking: {type: enabled, budget_tokens: 4000}
    cache: {enabled: false}

  trackb_assess_batch:               # 대량 재처리용 — 50% 절감
    inherits: trackb_assess
    use_batch_api: true

# 1M 토큰당 USD. 캐시 읽기는 입력의 10%, 캐시 쓰기는 125%.
pricing:
  claude-opus-5:   {input: 5.00, output: 25.00}
  claude-sonnet-5: {input: 3.00, output: 15.00}
  claude-haiku-4-5: {input: 1.00, output: 5.00}
cache_multiplier: {read: 0.10, write: 1.25}

cost_guard:
  per_assessment_usd_max: 5.0        # 초과 시 관리자 승인 요구
  daily_usd_max: 100.0
