# ═══════════════════════════════════════════════════════════════
#  RPL 증거 평가 기준 v0.2  —  기계 판독용
#
#  ※ 이 파일이 심사 기준의 단일 출처입니다.
#    기준서(docs/RPL_TrackB_증거평가기준(안)_v0.2.docx)와 내용이 일치해야 합니다.
#    값을 바꾸면 그 시점 이후 접수분부터 적용되며,
#    각 심사 기록에 rubric_version 이 남습니다.
#
#  status: confirmed | pending  —  pending 은 간담회 확정 대기
# ═══════════════════════════════════════════════════════════════
version: "0.2"
effective_from: "2026-09-01"
source_document: "RPL_TrackB_증거평가기준(안)_v0.2.docx"

# ── 신뢰도 등급 ────────────────────────────────────────────────
grades:
  A: {label: 공적증빙,   verification: 발급기관 온라인 조회, forgery_risk: low}
  B: {label: 기관발급,   verification: 발급처 확인,          forgery_risk: medium}
  C: {label: 산출물·기록, verification: 실물 대조·실기 재현,   forgery_risk: medium}
  D: {label: 제3자진술,  verification: 진술자 신원 확인,      forgery_risk: high}
  E: {label: 본인진술,   verification: 불가,                 forgery_risk: n/a}
grade_order: [A, B, C, D, E]

# ── 증명 차원 ──────────────────────────────────────────────────
dimensions: [신원, 소속·기간, 직무명, 수행내용, 역량수준, 최신성]

# ── 자료유형 × 증명차원  (full=○, partial=△, none=—) ───────────
document_types:
  국가기술자격증:
    grade: A
    aliases: [국가기술자격, 기술자격증, 자격증, 자격수첩, 기능사, 산업기사, 기사자격, 기술사]
    proves: {신원: full, 직무명: full, 수행내용: partial, 역량수준: full, 최신성: partial}
    note: 국가가 역량을 평가한 자료 — 제Ⅱ장 원칙의 예외
  학위·성적증명서:
    grade: A
    aliases: [성적증명, 학위증명, 졸업증명, 성적표, 학위기, 졸업장, 재학증명]
    proves: {신원: full, 소속·기간: full, 직무명: full, 수행내용: partial, 역량수준: partial, 최신성: partial}
    note: 교과목명만으로는 능력단위 대응 불확실 — 편성표 필요
  4대보험_가입내역:
    grade: A
    aliases: [4대보험, 사대보험, 자격득실, 국민연금, 건강보험, 고용보험, 가입내역, 가입증명]
    proves: {신원: full, 소속·기간: full, 최신성: full}
    note: 기간 확정에 가장 유용
  경력증명서:
    grade: B
    aliases: [경력증명, 재직증명, 근무경력, 경력확인]
    proves: {신원: full, 소속·기간: full, 직무명: full, 수행내용: partial, 최신성: full}
  NCS기반_훈련이수증:
    grade: B
    aliases: [ncs기반훈련이수증, ncs훈련이수증, 훈련과정이수증, 훈련이수증, ncs이수증, 훈련수료증, 직업훈련이수]
    time_source: true
    proves: {신원: full, 소속·기간: full, 직무명: full, 수행내용: full, 역량수준: full, 최신성: full}
    requires: [능력단위코드, 이수시간, 내부평가결과]
    note: 내부평가 합격이 확인될 때만 역량수준 인정 → R0 대상
  교육과정_편성표:
    grade: B
    # 「성취수준 확인서」는 학교·기관이 발급하는 교과 평가기록이다. 별칭을
    # 안 달아 두면 「확인서」만 걸려 제3자_확인서(D등급)로 잡힌다 — 실측으로
    # 학교 발급 서류가 D 로 들어가 판정 근거가 약해졌다. 긴 별칭이 이긴다.
    aliases: [교육과정편성표, 편성표, 교과편성, 교육과정표,
              성취수준확인서, 성취수준평가기록, 교과성취수준, 능력단위대응표,
              교과목성취수준확인서]
    time_source: true
    proves: {직무명: full, 수행내용: full}
    note: 교과목↔능력단위 대응만 증명. 평가결과는 증명 못 함
  강의계획서:
    grade: B
    # 편성표와 다르다. 편성표는 과정 전체의 교과목↔능력단위 대응표이고,
    # 강의계획서는 과목 하나의 주차별 학습내용·시수·평가방법이다. 능력단위
    # 코드가 없는 것이 보통이라 time_source 를 붙이지 않는다 — 붙여도 시간은
    # 본문의 능력단위코드에서만 나오고(extract_prior_learning), 대신 이 문서가
    # 근거 분석의 「추가 자료」 수에서 빠져 분석할 것이 없는 건으로 보인다.
    aliases: [강의계획서, 강의계획, 수업계획서, 교수계획서, 강의개요,
              교과목개요, 교과목계획서, 실라버스, syllabus]
    proves: {직무명: partial, 수행내용: full}
    note: 무엇을 가르쳤는지만 증명. 본인의 이수·평가는 증명 못 함 — 수료증과 함께 볼 것
  사내·기관_교육이수내역:
    grade: B
    aliases: [검정실시규정, 자격검정규정, 운영규정, 사내교육, 기관교육, 교육이수내역, 사내연수, 직무교육]
    proves: {신원: full, 소속·기간: full, 수행내용: partial, 최신성: partial}
  비NCS_교육수료증:
    grade: B
    aliases: [비ncs교육수료증, 민간훈련수료증, 민간훈련, 민간교육, 교육과정안내, 커리큘럼, 학원수료, 교육수료증, 수료증, 연수수료]
    proves: {신원: full, 소속·기간: full, 수행내용: partial, 최신성: partial}
    note: 능력단위 대응 정보 없음 → R0 불가
  작업일지·업무일지:
    grade: C
    aliases: [작업일지, 업무일지, 주방일지, 사육일지, 운영일지, 일지, 작업기록]
    proves: {소속·기간: partial, 직무명: full, 수행내용: full, 역량수준: partial, 최신성: full}
  포트폴리오·산출물:
    grade: C
    aliases: [포트폴리오, 산출물, 결과물, 작품집, 사진첩]
    proves: {수행내용: full, 역량수준: full, 최신성: partial}
  제3자_확인서:
    grade: D
    aliases: [확인서, 추천서, 소견서, 진술서, 증언]
    proves: {소속·기간: partial, 직무명: full, 수행내용: partial, 역량수준: partial, 최신성: partial}
  경력기술서·자기소개서:
    grade: E
    aliases: [학습경험기술서, 학습경험, 경험기술서, 경력기술, 자기소개, 자소서, 예비답변, 면접답변, 본인진술]
    proves: {소속·기간: partial, 직무명: full, 수행내용: full, 역량수준: partial}
  # ── 2026-09-23 추가 (3차 TF · Track B 사례) ──
  사업주자격증_정부인정:
    grade: A
    aliases: [정부인정사업주자격, 사업주자격정부인정, 기업자격정부인정]
    proves: {신원: full, 직무명: full, 수행내용: partial, 역량수준: full, 최신성: partial}
    note: 고용노동부 정부인정(고시 제2024-61호, 유효 3년) 사업주자격 — 출제·채점·사후관리 심사를 거침. 3차 TF 「국가 인정 자격에 준함」
  사업주자격증:
    grade: B
    aliases: [사업주자격, 사내자격, 사업내자격, 기업자격, 자격검정합격증]
    proves: {신원: full, 직무명: full, 수행내용: partial, 역량수준: partial, 최신성: partial}
    note: 정부인정을 받지 않은 사업주자격 — 발급 주체가 회사 자신. 검정실시규정과 함께 볼 것
  직무능력인정서:
    grade: A
    aliases: [직무능력인정, 직무능력은행, 인정서]
    proves: {신원: full, 소속·기간: full, 직무명: partial, 최신성: full}
    note: 직무능력은행 발급(법 제26조). 자격·훈련·교육·경력을 연계기관 전산으로 확인 — 경력증명서+4대보험 대체. 직무 내용·역량 수준은 담지 않는다
  기타:
    grade: D
    aliases: []
    proves: {}
    note: 종류를 정하지 못한 문서. 접수는 받되 담당자가 종류·등급을 지정하기 전에는 인정 근거로 쓰지 않는다 — 보고서가 「추가 지정 필요」로 안내

# ── 권고 구분 ──────────────────────────────────────────────────
recommendations:
  R0:
    label: 기이수 인정검토
    action: 추가 확인 없음
    priority: 0                       # 낮을수록 먼저 적용
    requires:
      prior_learning: true
      evaluation_passed: true
    downgrade_to: R1
    downgrade_if: {completed_hours_ratio_below: 0.50}
  R1:
    label: 서류인정검토
    action: 서류만으로 판단 가능
    priority: 1
    requires:
      performance_proven: true
      period_backing_grades: [A, B]   # ★ 본인진술(E) 단독 R1 금지
      ksa_coverage_min: 0.50          # ⚠ 쟁점 4 — 임시값(2026-09-23, Track A 인정선과 같은 50%). TF 결정 필요. 검증기가 실제 비율로 확인
                                      #   2026-10-02: 신형(수행준거) 판정에서는 「점수 ≥1 인 수행준거 비율」. 키 이름은 호환을 위해 유지
  R2: {label: 면접확인,     action: 화상면접,      priority: 2}
  R3: {label: 실기확인,     action: 대면실기·시연,  priority: 3}
  R4: {label: 추가서류요청, action: 서류 보완,     priority: 4}
  R5: {label: 미인정,       action: 훈련 이수,     priority: 5}

# ── 보조 규칙 ──────────────────────────────────────────────────
rules:
  R6_recency:
    status: pending                   # ⚠ 쟁점 3
    enabled: true
    years: {default: 5, fast_changing: 3}
    fast_changing_daebunryu: ["19", "20"]     # 전기·전자, 정보통신
    on_exceed: R3                     # 불인정이 아니라 실기 전환
  R7_conflict:
    enabled: true
    resolution: higher_grade_wins
    discard_loser: false              # 모순 사실을 기록에 남김
  R8_negative_priority:
    enabled: false                    # 2026-09-23 삭제 — 「한 것만 매칭한다」. 부정 진술은 판정에 쓰지 않는다 (사용자 결정)
    scope: element
    exception_core_ksa: false
  R12_prior_vs_recency:
    status: pending                   # ⚠ 쟁점 12
    winner: prior_learning            # prior_learning | recency | by_occupation
    manual_skill_daebunryu: ["12", "13", "16"]   # ③ 선택 시 사용

# ── 훈련시간 ───────────────────────────────────────────────────
training_hours:
  adjustment_floor: 0.50              # 고시 「−50%까지 조정 가능」
  hold_floor: 0.30                    # ⚠ 2차 TF 제안 보류 구간 하한 — 미확정
  cbq_composition_range: {min: 0.80, max: 1.50}   # 과정평가형 편성 허용범위

# ── Track A 판정 (결정론) ──────────────────────────────────────
#   과정평가형 자격 등 NCS 기반 이수자. 능력단위·기록 확인만으로 판정한다.
#   ratio = 이수시간 / 요구시간
track_a:
  # 2차 TF(2026-09-21) 논의 반영: 50% 이상은 조건 없이 그 단위 요구시간 전체 인정(운영매뉴얼 규칙),
  # 30~50% 는 「보류」— 부족 이유와 추가 증빙을 안내하고 위원이 판단, 30% 미만·코드 불일치는 불인정.
  # 보류 구간 자체는 미확정(pending_decisions). 대안으로 「자격 단위 인정」(국가 검정 자격은
  # 코드 일치 단위를 시간과 무관하게 인정) 입장이 병존하므로 보고서에 참고값으로 함께 보인다.
  verdicts:                          # 위에서부터 먼저 맞는 것을 채택
    - id: 완전충족
      when: {ratio_gte: 1.0}
      recommendation: R0
      verification: 불필요
    - id: 조정범위내
      when: {ratio_gte: 0.50}        # training_hours.adjustment_floor 과 일치해야 함
      recommendation: R0
      verification: 불필요
      note: 훈련기준 「−50%까지 조정 가능」 조항 적용 — 요구시간 전체 인정
    - id: 보류
      when: {ratio_gte: 0.30}        # training_hours.hold_floor 과 일치해야 함 ⚠ 미확정
      recommendation: R4
      verification: 추가서류
      note: 코드는 일치하나 이수시간이 하한(50%) 미만 — 추가 증빙 후 위원 판단 (2차 TF 보류 구간)
    - id: 시간부족
      when: {ratio_gt: 0.0}
      recommendation: R5
      verification: 훈련
      note: 이수시간이 요구의 30% 미만 — 자동 불인정 (2차 TF)
    - id: 미이수
      when: {absent: true}
      recommendation: R5
      verification: 훈련
  # 보고서·집계용 묶음. 인정 = 요구시간 전체 감면, 보류 = 위원 판단 대기, 불인정 = 훈련 이수.
  buckets:
    인정: [완전충족, 조정범위내]
    보류: [보류]
    불인정: [시간부족, 미이수]
  # 보류 단위에 안내할 추가 증빙 — document_types 의 이름을 쓴다.
  # 2차 TF 에서 거론된 것: 학습경험기술서, 기업현장교사(현장) 확인서, 현장 작업일지.
  hold_evidence: [제3자_확인서, 작업일지·업무일지, 경력증명서, 사내·기관_교육이수내역, 경력기술서·자기소개서]
  confidence:
    # 과정평가형 편성시간은 기준값이며 기관이 80~150% 범위에서 편성한다.
    # 하한(80%)으로 계산해도 판정이 그대로면 확정, 바뀌면 추정.
    rule: recompute_with_composed_hours_min
    labels: {stable: 확정, unstable: 추정(이수증명 필요)}

# ── Track B 위원 화면 (2026-09-23, 3차 TF 반영) ─────────────────
track_b:
  # 요소 권고를 위원용 세 묶음으로 접는다. 화면에는 R 코드가 나오지 않는다.
  display_buckets:
    인정후보: [R0, R1]
    추가확인: [R2, R3, R4]
    미인정: [R5]
  # 3차 TF: 재현가능성(시연·구술)은 외부평가 몫. 실기(R3) 권고는 「외부평가에서 확인」으로 표시한다.
  practical_to_external: true
  # 3점 정량표의 축. 시간·기간은 문서에서 읽는 표시용 추정(time_axis) — App 본 계산이 아니다.
  three_point_axes: [내용일치성, 시간기간, 검증가능성]
  # ── 수행준거 점수 (2026-10-02, 4차 TF 합의) ──
  #   판정 단위가 KSA 항목에서 수행준거로 바뀌었다. 수행준거마다 0/1/2 점을 매긴다.
  #   존재 기준: 직접 근거가 1건이라도 있으면 2, 직접은 없고 간접만 있으면 1, 근거가 없으면 0.
  #   부정 진술이 붙은 수행준거는 0 (negative_overrides). 위원이 0/1/2 를 직접 고칠 수 있다.
  #   「과반」 기준은 쓰지 않는다 — 근거 조각 수는 AI 실행마다 달라 분모가 우연값이 된다.
  pc_scoring:
    values: [0, 1, 2]                 # 점수 어휘 (위원 입력 검증용)
    direct: 2
    indirect: 1
    none: 0
    negative_overrides: true
  # 능력단위 판정: 0 인 수행준거가 하나라도 있으면 불인정(require_all_nonzero),
  #   전부 ≥1 이고 평균 ≥ accept_mean → 인정 · 평균 ≥ hold_mean → 보류 · 미만 → 불인정.
  #   1.5 는 「절반은 2, 절반은 1」인 출발값이다(4차 TF 직후 합의). 경험적으로 검증한다.
  unit_rule:
    require_all_nonzero: true
    accept_mean: 1.5                  # ⚠ 미확정 — 5차 TF
    hold_mean: 1.0                    # ⚠ 미확정 — 5차 TF

# ── AI 산출물 어휘 ─────────────────────────────────────────────
#   Track B 분석기가 쓸 수 있는 값의 전부. 검증기가 이 목록으로 대조한다.
#   여기에 없는 값이 나오면 오류로 잡고 재요청한다.
output_vocabulary:
  evidence_level: [충분, 부분, 없음, 부정진술]
  verification_method: [불필요, 화상면접, 대면실기, 추가서류, 훈련]
  confidence: [high, medium, low]
  evidence_fit: [직접, 간접, 부정]     # 근거 적합도 (2026-09-24). 직접 → 2점 · 간접 → 1점 · 부정 → 0점 (2026-10-02 수행준거 점수)

# ── 보완 부담 최소화 ───────────────────────────────────────────
remediation:
  methods: [추가서류, 면접, 실기, 훈련]
  face_to_face: [면접, 실기]           # 지원자가 출석해야 하는 것
  burden_order: [추가서류, 면접, 실기]
  assignment_sequence:
    - {when: recommendation_is_R0,        then: none}
    - {when: resolvable_by_document,      then: 추가서류}
    - {when: has_uncovered_skill_ksa,     then: 실기, absorb_into_oral_check: [지식, 태도]}
    - {otherwise: 면접}
  face_to_face_max_per_element: 1
  merge_practical_by: unit             # 실기는 능력단위 단위로 통합
  practical_exemption_forbidden:
    - 안전직결
    - 신체숙련
    - 원리미인지
    - 자료상충_미해소
    - 최신성_미달
  practical_max_per_applicant: null    # ⚠ 쟁점 D-6 — 미정

# ── 증거 없는 KSA 상태 ─────────────────────────────────────────
uncovered_status:
  교육이수(미평가): {typical_method: 추가서류, allow_practical: false}
  미확보:          {typical_method: null}
  부정진술:        {typical_method: 훈련}

# ── 제3자 확인서 ───────────────────────────────────────────────
third_party_statement:
  status: pending                     # ⚠ 쟁점 5
  family_written: downgrade           # reject | downgrade | accept
  standalone_accepted: false
  substitute_documents:
    - 농업경영체등록확인서
    - 4대보험 가입내역
    - 농지원부
    - 출하·거래 실적 증빙

# ── 최종 판정 (전문가 TF) ──────────────────────────────────────
#   시스템은 여기에 값을 쓰지 않는다. 사람이 기록하는 칸이다.
final_decision:
  element_decisions: [인정, 조건부인정, 불인정, 보류]
  # 네 가지가 각각 무슨 뜻인지. 심사위원이 화면에서 고르는 값이므로
  # 뜻이 어디에도 적혀 있지 않으면 사람마다 다르게 쓰게 된다.
  # 화면은 이 문장을 그대로 보여 준다 — 코드에 따로 적지 않는다.
  element_decision_meanings:
    인정:      이 항목은 채워졌습니다. 추가 확인 없이 훈련시간을 감면합니다.
    조건부인정: 근거는 서지만 면접·실기를 통과해야 확정합니다. 통과하지 못하면 감면하지 않습니다.
    불인정:    채워지지 않았습니다. 해당 시간은 훈련으로 이수해야 합니다.
    보류:      지금 자료로는 정할 수 없습니다. 서류를 더 받은 뒤 다시 봅니다.
  # 능력단위 시간을 감면하는 방식.
  #   all_elements  요소 전부가 인정되어야 그 능력단위 시간을 감면 (보수적)
  #   proportional  인정된 요소 비율만큼 감면
  unit_credit_rule: all_elements    # ⚠ 쟁점 D-7 — 미정
  # 조건부인정은 면접·실기를 통과해야 확정된다. 두 수를 나눠 보여준다.
  conditional_counts_toward: 조건부포함
  decisions: [전체인정, 부분인정, 불인정]
  thresholds: {전체인정: 1.0, 불인정: 0.0}   # 인정시간 / 총 필수시간

# ── 미확정 항목 색인 (기동 시 경고 출력) ───────────────────────
pending_decisions:
  - {key: recommendations.R1.requires.ksa_coverage_min, issue: 쟁점 4, urgency: critical}
  - {key: rules.R6_recency,                             issue: 쟁점 3, urgency: high}
  - {key: rules.R12_prior_vs_recency.winner,            issue: 쟁점 12, urgency: high}
  - {key: third_party_statement.family_written,         issue: 쟁점 5,  urgency: high}
  - {key: remediation.practical_max_per_applicant,      issue: D-6,    urgency: medium}
  - {key: final_decision.unit_credit_rule,              issue: D-7,    urgency: high}
  - {key: track_a.verdicts.보류,                          issue: 2차TF 쟁점3, urgency: high}   # 30~50% 보류 구간 vs 자격 단위 인정
  - {key: track_b.practical_to_external,                 issue: 3차TF 실기, urgency: medium}  # 실기(R3)를 외부평가에 맡길지
  - {key: track_b.unit_rule.accept_mean,                 issue: 4차TF 수행준거 문턱, urgency: critical}   # 1.5 / 1.0 은 출발값
